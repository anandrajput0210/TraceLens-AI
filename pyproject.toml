[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelens-ai"
version = "0.1.0"
description = "Context-aware security risk intelligence for software repositories."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.dynamic]
dependencies = {file = ["backend/requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["backend"]
pythonpath = ["backend"]
addopts = "-ra"
